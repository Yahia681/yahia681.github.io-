<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Taleora | القراءة</title>

<style>

:root{
  --bg:#100d0b;
  --card:#191411;
  --text:#fff8ef;
  --muted:#b9aa9b;
  --gold:#f0c982;
  --line:#ffffff18;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
  transition:.3s;
}

/* وضع القراءة */

body.reading{
  --bg:#f4ead9;
  --card:#fffaf0;
  --text:#30261e;
  --muted:#75685b;
  --gold:#8b5a25;
  --line:#00000015;
}

/* الهيدر */

header{
  position:sticky;
  top:0;
  z-index:20;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:14px 6%;

  background:#100d0bed;
  backdrop-filter:blur(12px);

  border-bottom:1px solid var(--line);
}

body.reading header{
  background:#f4ead9ee;
}

.logo{
  color:var(--gold);
  font-size:23px;
  font-weight:900;
}

.logo small{
  display:block;
  color:var(--text);
  font-size:8px;
  letter-spacing:5px;
  text-align:center;
}

.back{
  background:#ffffff10;
  border:1px solid var(--line);
  color:var(--text);
  padding:9px 14px;
  border-radius:9px;
  cursor:pointer;
}

/* أدوات القراءة */

.tools{
  width:90%;
  max-width:850px;
  margin:20px auto 0;

  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

.tool{
  background:var(--card);
  color:var(--text);

  border:1px solid var(--line);

  padding:9px 13px;

  border-radius:9px;

  cursor:pointer;
}

/* الصفحة */

.reader{
  width:90%;
  max-width:850px;

  margin:35px auto 90px;
}

.title{
  text-align:center;
  margin-bottom:35px;
}

.title h1{
  font-size:36px;
  margin:0 0 10px;
}

.author{
  color:var(--gold);
}

/* الكتاب */

.content{
  background:var(--card);

  border:1px solid var(--line);

  border-radius:20px;

  padding:35px 40px;

  box-shadow:0 15px 40px #0004;

  transition:.3s;
}

.chapter{
  text-align:center;

  color:var(--gold);

  font-size:22px;

  margin-bottom:30px;
}

#story{
  font-size:18px;
  line-height:2.2;
}

#story p{
  margin-bottom:25px;
}

.buttons{
  display:flex;

  justify-content:center;

  gap:10px;

  margin-top:35px;
}

.nav{
  background:var(--gold);

  color:#24170d;

  border:0;

  border-radius:10px;

  padding:12px 20px;

  cursor:pointer;

  font-weight:900;
}

.nav:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.progress{
  text-align:center;

  margin-top:20px;

  color:var(--muted);

  font-size:13px;
}

footer{
  padding:30px;

  text-align:center;

  border-top:1px solid var(--line);

  color:var(--muted);
}

/* الموبايل */

@media(max-width:600px){

  .title h1{
    font-size:29px;
  }

  .content{
    padding:25px 20px;
  }

  #story{
    font-size:17px;
    line-height:2.1;
  }

}

</style>

</head>

<body>


<header>

<div class="logo">

Taleora

<small>
TALEORA
</small>

</div>

<button
class="back"
onclick="goBack()"
>
← رجوع
</button>

</header>


<!-- أدوات القراءة -->

<div class="tools">

<button
class="tool"
onclick="changeFont(1)"
>
🔤 تكبير
</button>

<button
class="tool"
onclick="changeFont(-1)"
>
🔡 تصغير
</button>

<button
class="tool"
onclick="toggleReadingMode()"
>
🌙 وضع القراءة
</button>

</div>


<main class="reader">


<div class="title">

<h1 id="bookTitle">
جاري تحميل الرواية...
</h1>

<div
class="author"
id="bookAuthor"
>
</div>

</div>


<article class="content">

<div
class="chapter"
id="chapterTitle"
>
الفصل الأول
</div>


<div id="story">

<p>
مرحبًا بك في عالم Taleora.
</p>

<p>
هذه صفحة القراءة الخاصة بالرواية.
هنا يمكنك قراءة الفصول والتنقل بينها
بسهولة.
</p>

<p>
كانت البداية هادئة، لكن شيئًا ما
كان على وشك تغيير كل شيء...
</p>

</div>


<div class="buttons">

<button
class="nav"
id="previous"
onclick="previousChapter()"
>
→ الفصل السابق
</button>

<button
class="nav"
id="next"
onclick="nextChapter()"
>
الفصل التالي ←
</button>

</div>


<div
class="progress"
id="progress"
>
الفصل 1 من 3
</div>

</article>

</main>


<footer>

<strong style="color:#e8b56e">
Taleora
</strong>

<br><br>

عالمك بين صفحات الحكايات © 2026

</footer>


<script>

/* =========================
   بيانات الروايات
========================= */

const books={

1:{
title:"ألف شمس ساطعة",
author:"خالد حسيني"
},

2:{
title:"خريف البراءة",
author:"أحمد مراد"
},

3:{
title:"الرحلة",
author:"باسم خندقجي"
},

4:{
title:"قواعد العشق الأربعون",
author:"إليف شافاق"
},

5:{
title:"عندما يعزف الشيطان",
author:"منى الشاذلي"
},

6:{
title:"ليلة لا تنتهي",
author:"محمد صادق"
},

7:{
title:"1984",
author:"جورج أورويل"
},

8:{
title:"مئة عام من العزلة",
author:"غابرييل غارسيا ماركيز"
},

9:{
title:"الحصان الأسود",
author:"أحمد خالد توفيق"
},

10:{
title:"الأمير الصغير",
author:"أنطوان دو سانت"
},

11:{
title:"تذكرة إلى سرمد",
author:"أحمد مراد"
},

12:{
title:"رجال في الشمس",
author:"غسان كنفاني"
}

};


/* =========================
   معرفة الرواية
========================= */

const params=
new URLSearchParams(
window.location.search
);

const bookId=
params.get("id");

const book=
books[bookId];


/* =========================
   عرض الرواية
========================= */

if(book){

document.getElementById("bookTitle")
.textContent=book.title;

document.getElementById("bookAuthor")
.textContent=
"✍️ "+book.author;

}


/* =========================
   الفصول
========================= */

const chapters=[

{
title:"الفصل الأول",

text:`

<p>
كانت البداية هادئة، وكان كل شيء يبدو طبيعيًا.
</p>

<p>
لكن بعض الحكايات لا تبدأ عندما نتوقعها،
بل تبدأ في اللحظة التي يتغير فيها شيء صغير.
</p>

<p>
ومن هنا بدأت رحلة جديدة مليئة بالأسرار
والأسئلة التي تحتاج إلى إجابات.
</p>

`
},

{
title:"الفصل الثاني",

text:`

<p>
مرت الأيام، وبدأت التفاصيل الصغيرة
تكشف عن نفسها واحدة تلو الأخرى.
</p>

<p>
كل إجابة كانت تقود إلى سؤال جديد،
وكل خطوة كانت تجعل العودة إلى الوراء
أكثر صعوبة.
</p>

<p>
كان واضحًا أن الحكاية لم تكن كما تبدو
من البداية.
</p>

`
},

{
title:"الفصل الثالث",

text:`

<p>
وصلت الأحداث إلى لحظة لم يعد فيها
أي شيء كما كان.
</p>

<p>
بدأت الصورة تكتمل، وظهرت الحقيقة
التي كانت مختبئة خلف الكثير من الأسرار.
</p>

<p>
وهنا بدأت الحكاية تأخذ اتجاهًا جديدًا تمامًا.
</p>

`
}

];


let currentChapter=
Number(
localStorage.getItem(
"taleora_chapter_"+bookId
)
)||0;


/* =========================
   عرض الفصل
========================= */

function renderChapter(){

const chapter=
chapters[currentChapter];

document.getElementById("chapterTitle")
.textContent=
chapter.title;

document.getElementById("story")
.innerHTML=
chapter.text;

document.getElementById("progress")
.textContent=
"الفصل "+
(currentChapter+1)+
" من "+
chapters.length;


/* تعطيل الأزرار */

document.getElementById("previous")
.disabled=
currentChapter===0;

document.getElementById("next")
.disabled=
currentChapter===
chapters.length-1;


/* حفظ آخر فصل */

localStorage.setItem(
"taleora_chapter_"+bookId,
currentChapter
);

}


/* =========================
   الفصل التالي
========================= */

function nextChapter(){

if(
currentChapter<
chapters.length-1
){

currentChapter++;

renderChapter();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

}


/* =========================
   الفصل السابق
========================= */

function previousChapter(){

if(
currentChapter>0
){

currentChapter--;

renderChapter();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

}


/* =========================
   حجم الخط
========================= */

let fontSize=18;

function changeFont(amount){

fontSize+=amount;

if(fontSize<14)
fontSize=14;

if(fontSize>26)
fontSize=26;

document.getElementById("story")
.style.fontSize=
fontSize+"px";

}


/* =========================
   وضع القراءة
========================= */

function toggleReadingMode(){

document.body.classList.toggle(
"reading"
);

}


/* =========================
   رجوع
========================= */

function goBack(){

window.location.href=
"book.html?id="+bookId;

}


/* =========================
   تشغيل
========================= */

renderChapter();

</script>

</body>

  </html>
