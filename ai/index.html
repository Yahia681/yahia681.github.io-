<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Taleora AI 🤖</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #0d0a09;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #16120f;
      border-bottom: 1px solid #d9a45e;
    }

    header h1 {
      margin: 0;
      color: #d9a45e;
    }

    header p {
      color: #aaa;
    }

    .chat {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    #messages {
      min-height: 400px;
      background: #16120f;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      overflow-y: auto;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      line-height: 1.6;
    }

    .ai {
      background: #272019;
    }

    .user {
      background: #d9a45e;
      color: #111;
      margin-right: 40px;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      background: #d9a45e;
      color: #111;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #f0bf78;
    }
  </style>
</head>

<body>

  <header>
    <h1>🤖 Taleora AI</h1>
    <p>مساعدك الذكي لاكتشاف الكتب والروايات</p>
  </header>


  <div class="chat">

    <div id="messages">

      <div class="message ai">
        👋 أهلاً بك! أنا Taleora AI.
        <br>
        قل لي نوع الروايات التي تحبها وسأرشح لك كتبًا مناسبة.
      </div>

    </div>


    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="مثلاً: عايز كتاب رعب..."
      >

      <button onclick="sendMessage()">
        إرسال
      </button>

    </div>

  </div>


  <!-- ملف الكتب -->
  <script src="../books.js"></script>


  <!-- كود Taleora AI -->
  <script>

    function sendMessage() {

      const input = document.getElementById("userInput");
      const message = input.value.trim();

      if (message === "") return;

      const messages = document.getElementById("messages");


      // إظهار رسالة المستخدم
      messages.innerHTML += `
        <div class="message user">
          ${message}
        </div>
      `;


      input.value = "";


      const userText = message.toLowerCase();

      let category = null;


      // تحديد نوع الكتاب
      if (
        userText.includes("رعب") ||
        userText.includes("مرعب") ||
        userText.includes("خوف")
      ) {

        category = "رعب";

      }

      else if (
        userText.includes("رومانسي") ||
        userText.includes("رومانسية") ||
        userText.includes("حب")
      ) {

        category = "رومانسية";

      }

      else if (
        userText.includes("مغامرة") ||
        userText.includes("خيال") ||
        userText.includes("مشوق")
      ) {

        category = "مغامرة";

      }

      else if (
        userText.includes("غموض") ||
        userText.includes("جريمة") ||
        userText.includes("ألغاز")
      ) {

        category = "غموض";

      }

      else if (
        userText.includes("كلاسيك") ||
        userText.includes("تاريخ")
      ) {

        category = "كلاسيكيات";

      }


      let reply = "";


      if (category) {

        const results = books.filter(
          book => book.category === category
        );


        if (results.length > 0) {

          reply = `
            🤖 أنصحك بهذه الكتب في قسم <b>${category}</b>:<br><br>
          `;


          results.forEach(book => {

            reply += `
              📚 <b>${book.title}</b><br>
              ✍️ ${book.author}<br>
              💰 ${book.price} جنيه<br><br>
            `;

          });

        } else {

          reply = "🤖 للأسف لم أجد كتبًا في هذا القسم.";

        }

      }

      else {

        reply = `
          🤖 لم أفهم نوع الكتاب الذي تبحث عنه 😅<br><br>

          جرب تقول مثلًا:<br><br>

          👻 عايز كتاب رعب<br>
          ❤️ عايز رواية رومانسية<br>
          🕵️ عايز كتاب غموض<br>
          🗺️ عايز كتاب مغامرة<br>
          📚 عايز كتاب كلاسيكي
        `;

      }


      // ظهور الرد
      setTimeout(() => {

        messages.innerHTML += `
          <div class="message ai">
            ${reply}
          </div>
        `;

        messages.scrollTop = messages.scrollHeight;

      }, 500);

    }


    // الإرسال عند الضغط على Enter
    document.getElementById("userInput")
      .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      });

  </script>

</body>
</html>
